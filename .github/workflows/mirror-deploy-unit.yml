# Every job of this workflow is skipped, so no runner starts, until IT sets the repository variable
# MIRROR_PIPELINE_ENABLED to true after the setup in PIPELINE.md section 3.
#
# Deploys one unit of deploy/units.json as a deployment stack, in a plan and an apply that are jobs of one run.
# The plan signs in with the reader identity and previews the stack. The apply creates or updates the stack with
# Microsoft's action azure/bicep-deploy, and it starts only after the required reviewers of the unit's GitHub
# environment have read the plan on the run page and approved it. A reviewer is never the person who started the
# run, because every mirror-production and mirror-privileged environment has "Prevent self-review" on.
#
# It starts only with Run workflow (workflow_dispatch) on master. A merge into master never starts it, because the
# pull request's preview already shows what the merge would change, and every deployment needs a change ticket, a
# reason and a reviewer, which only Run workflow carries. Run workflow names one unit, the change ticket and the
# reason. Leave apply off for a plan only. With apply on, the apply waits for the reviewers.
#
#   units    No Azure. Reads the unit from deploy/units.json and writes the row the other jobs use: the scope, the
#            name and the files of its stack. A unit that is not enabled is refused, and so is the unit of a
#            deploy-excluded file, which is never deployed.
#   plan     The reader identity (environment mirror-reader-dispatch, master only). It validates the stack and
#            previews it with the Azure CLI (az stack validate, az stack-whatif), and writes the preview to the
#            job summary and to an artifact. When the file deploy/adoption/<unit>.md exists, the summary also
#            carries it. That file explains the differences a unit's first preview lists before its stack has a
#            baseline, and it is deleted after the unit's first deployment. A first run that brings existing
#            resources under the stack fails its plan when the file is missing, says it is not evidence, or was
#            written from another version of the unit's template or parameters file.
#   apply    The deploy identity of the unit's subscription, through the environment mirror-production-<subscription
#            folder>, or the govern identity through mirror-privileged-<subscription folder> or
#            mirror-privileged-tenant for a unit of the privileged tier. Only master may use these environments, and
#            they hold the required reviewers. After the approval the job first checks that the plan is still
#            current, which means that master's tip is still the commit of the run and that the plan is not
#            older than 72 hours (the repository variable MIRROR_MAX_PLAN_AGE_HOURS changes the number). An approval that comes after a
#            later merge, or too late, deploys nothing, and the deployment is started again. Then the job creates
#            or updates the stack mirror-<unit> with azure/bicep-deploy from the same commit as the plan, because
#            both are jobs of the same run.
#
# The stack of a unit:
#   - A resource group unit is a resource group stack, a subscription unit a subscription stack, and a tenant-kind
#     unit a management group stack at the management group the unit names.
#   - No deny settings (deny-settings-mode: none).
#   - A resource that left the template is detached, which leaves it in Azure. A unit with "stackDeletes": true in
#     deploy/units.json deletes it instead. The plan shows each one as detach or delete before anybody approves.
#     A resource group and a management group are always detached, never deleted. The tenant units and the units
#     of fdm-apim may not have stackDeletes.
#   - A deployment writes the whole template again, so it also takes back a change made by hand to any resource the
#     stack manages. The plan lists each such change as a modify.
#
# The plan runs the Azure CLI and not the action. This is not yet done because the released action (v2.5.0) sends no
# validation level with a stack validation or a stack preview, so Azure checks write rights and refuses the reader
# identity, and because the action writes a preview to the log only, where the approver of the run does not read
# it. The next release of the action carries the validation level. The CLI commands take the same template, the
# same parameters and the same stack settings as the action in the apply job.
#
# A re-run never deploys, because the apply runs only on the first attempt of a run. A production deploy identity
# holds Contributor, Role Based Access Control Administrator limited by a condition that excludes Owner, User Access
# Administrator and Role Based Access Control Administrator, Resource Policy Contributor and the custom role Mirror
# Lock Writer on its own subscription, plus a narrow role where a unit needs one (peering on a remote network, a
# Key Vault secret read for a deployment, a container write). Azure refuses it an Owner-class assignment, so those
# and the role definitions are in separate units of the privileged tier, deployed by the govern identity of the
# subscription or of the tenant. The preflight in mirror-validate fails a production unit that declares a role
# assignment of a role that is not on the list of its subscription.
# Neither identity has a secret, and its federated credential trusts only its own environment, which only master
# may use (PIPELINE.md section 1.5).
#
# Variables per environment (none is secret): AZURE_CLIENT_ID, the client ID of that environment's identity, and
# AZURE_TENANT_ID. One federated credential per environment. Its subject is copied from the subject a first run of
# the repository presents, not typed from a pattern, because a repository created after July 2026 carries the
# owner and repository IDs in it.
name: mirror-deploy-unit
run-name: ${{ format('Deploy {0} ({1})', inputs.unit, inputs.changeRef) }}

on:
  workflow_dispatch:
    inputs:
      unit:
        description: Deployment unit (name from deploy/units.json)
        required: true
        type: string
      changeRef:
        description: Change ticket number
        required: true
        type: string
      reason:
        description: What this deployment is for
        required: true
        type: string
      apply:
        description: Deploy after a reviewer approves the plan. Leave off for a plan only
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  # SHA256 of bicep-win-x64.exe (a Windows runner) and of bicep-linux-x64 (a Linux runner) in the Bicep v0.49.2
  # GitHub release. Change the three together, with the bicep-version input of the apply job below and the Bicep
  # version that scripts/deploy-unit.ps1, scripts/whatif-rg-sweep.sh and scripts/whatif-sub-sweep.sh require.
  BICEP_VERSION: v0.49.2
  BICEP_SHA256_WINDOWS: ACFFF0453C9BCF442AA97103ACBCD845EF366634E6EA2A2BA5734514409CE9C3
  BICEP_SHA256_LINUX: 0AB9DE90C2493F206F8281BAE74F9EE2D5ED3605548DAB1ADF41FEF185E1F7C5

# Actions are pinned to the full commit SHA of the release named in the comment. Every job runs on windows-2025, or
# on ubuntu-24.04 when the repository variable MIRROR_RUNNER is ubuntu-24.04. No other value of the variable reaches
# runs-on, and the runner check, the step after the checkout in every job, stops the job on any other runner. The
# runner check and the Bicep pin are the two local actions under .github/actions.
jobs:
  units:
    if: vars.MIRROR_PIPELINE_ENABLED == 'true'
    runs-on: ${{ vars.MIRROR_RUNNER == 'ubuntu-24.04' && 'ubuntu-24.04' || 'windows-2025' }}
    permissions:
      contents: read
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.units.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Runner check
        uses: ./.github/actions/runner-check
      - id: units
        name: Read the unit
        shell: pwsh
        env:
          SELECT: unit
          UNIT: ${{ inputs.unit }}
          CHANGE_REF: ${{ inputs.changeRef }}
          REASON: ${{ inputs.reason }}
          STARTED_BY: ${{ github.actor }}
        run: |
          & ./.github/scripts/mirror-pipeline.ps1 -Mode Units
          exit $LASTEXITCODE

  plan:
    needs: units
    if: vars.MIRROR_PIPELINE_ENABLED == 'true' && needs.units.outputs.matrix != '[]'
    name: plan ${{ matrix.unit }}
    runs-on: ${{ vars.MIRROR_RUNNER == 'ubuntu-24.04' && 'ubuntu-24.04' || 'windows-2025' }}
    # The environment's branch rule (master only) makes GitHub refuse the job on any other branch, and the reader
    # identity's credential for it trusts only that environment. No deployment is recorded for a plan.
    environment:
      name: mirror-reader-dispatch
      deployment: false
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 120
    outputs:
      # The time the preview was taken. A run plans one unit, so the matrix has one row and this is its value.
      planned: ${{ steps.preview.outputs.taken }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.units.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Runner check
        uses: ./.github/actions/runner-check
      - name: Check the Bicep inputs
        # Before the sign-in. Bicep may not read environment variables, registry modules or files outside the
        # repository, because the job holds the reader token.
        shell: pwsh
        env:
          UNIT: ${{ matrix.unit }}
        run: |
          & ./.github/scripts/mirror-pipeline.ps1 -Mode InputCheck
          exit $LASTEXITCODE
      - name: Pin and check the Bicep CLI
        uses: ./.github/actions/setup-bicep
      - name: Tool versions
        shell: pwsh
        run: |
          az version -o json
          az bicep version
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - id: preview
        name: Validate and preview the stack
        # az stack validate, then az stack-whatif. The preview is the plan the reviewers of the apply read. It
        # leaves one preview object at the scope of the stack. Azure deletes it after its retention of one hour,
        # which can take some hours longer.
        shell: pwsh
        env:
          UNIT: ${{ matrix.unit }}
        run: |
          & ./.github/scripts/mirror-pipeline.ps1 -Mode StackWhatIf -Dir (Join-Path $env:RUNNER_TEMP 'plan')
          exit $LASTEXITCODE
      - name: Adoption evidence of a first run
        # deploy/adoption/<unit>.md explains the differences the first preview of a unit lists before its stack
        # has a baseline. It is in the repository only until the unit's first deployment. A first run that brings
        # existing resources under the stack needs that evidence, so the plan fails when the file is missing, when
        # it says it is not evidence, and when the SHA256 it names for the unit's template or parameters file is
        # not the SHA256 of the file in this commit (line endings left out). A first run that only creates
        # resources, and every later run, passes without the file.
        shell: pwsh
        env:
          UNIT: ${{ matrix.unit }}
          TEMPLATE: ${{ matrix.template }}
          PARAMETERS: ${{ matrix.parameters }}
        run: |
          $verdict = Get-Content -Raw -LiteralPath (Join-Path (Join-Path $env:RUNNER_TEMP 'plan') 'whatif-result.json') -Encoding utf8 | ConvertFrom-Json
          $needed = ($verdict.firstRun -eq $true -and [int]$verdict.adopted -gt 0)
          $file = Join-Path (Join-Path 'deploy' 'adoption') "$env:UNIT.md"
          $problems = @()
          if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
            if ($needed) { $problems += "the file deploy/adoption/$env:UNIT.md is missing" } else { Write-Host "No adoption evidence file for $env:UNIT, and this run needs none."; exit 0 }
          } else {
            $text = [IO.File]::ReadAllText($file)
            @('', '---', '', "## Adoption evidence for the first run of $env:UNIT", '', "From the file deploy/adoption/$env:UNIT.md of this commit.", '', $text) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            if ($text -match 'This file cannot be relied on' -or $text -match 'this file is not evidence yet') { $problems += "the file deploy/adoption/$env:UNIT.md says it is not evidence" }
            foreach ($path in @($env:TEMPLATE, $env:PARAMETERS) | Where-Object { $_ }) {
              $m = [regex]::Match($text, '(?m)^- `' + [regex]::Escape($path) + '` SHA256 `([0-9a-f]{64})`\s*$')
              $bytes = [Text.UTF8Encoding]::new($false).GetBytes([IO.File]::ReadAllText($path).Replace("`r`n", "`n"))
              $now = [BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash($bytes)).Replace('-', '').ToLowerInvariant()
              if (-not $m.Success) { $problems += "the file deploy/adoption/$env:UNIT.md names no SHA256 for $path" }
              elseif ($m.Groups[1].Value -cne $now) { $problems += "the evidence was written from another version of $path (SHA256 $($m.Groups[1].Value) in the file, $now in this commit)" }
            }
          }
          if ($problems.Count -eq 0) { Write-Host "The adoption evidence of $env:UNIT is in the job summary."; exit 0 }
          $say = "Adoption evidence of ${env:UNIT}: $($problems -join '. ')."
          if (-not $needed) { Write-Host "::warning::$say This run brings no existing resource under a new stack, so the plan goes on."; exit 0 }
          @('', "**The plan fails. This is the first run of $env:UNIT and it brings $($verdict.adopted) existing resource(s) under the stack, so it needs adoption evidence. $say** Take a read-only preview of the unit, write the file again with adoption/adoption.py and start the deployment again.", '') | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Write-Host "::error::$say"
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: plan-${{ matrix.unit }}
          path: ${{ runner.temp }}/plan

  apply:
    needs: [ units, plan ]
    # The first attempt only. A re-run of this job alone would deploy without a fresh plan.
    if: vars.MIRROR_PIPELINE_ENABLED == 'true' && inputs.apply && needs.plan.result == 'success' && github.run_attempt == '1'
    name: apply ${{ matrix.unit }}
    runs-on: ${{ vars.MIRROR_RUNNER == 'ubuntu-24.04' && 'ubuntu-24.04' || 'windows-2025' }}
    # The job waits here for the required reviewers of the environment, and the identity cannot sign in until one
    # of them who did not start the run approves. The tier is production or privileged and the scope is the
    # subscription folder of the unit or tenant, both written by the units job from deploy/units.json.
    environment: mirror-${{ matrix.tier }}-${{ matrix.scope }}
    permissions:
      # contents: read also lets the job read master's tip for the check of the plan.
      contents: read
      id-token: write
    timeout-minutes: 240
    concurrency:
      # One deployment per subscription at a time, for the units of both tiers, so two units that write the same
      # resources never run together. The three tenant units share the group of the tenant scope. queue: max
      # keeps a later run waiting instead of cancelling the pending one.
      group: mirror-scope-${{ matrix.scope }}
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.units.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Runner check
        uses: ./.github/actions/runner-check
      - name: Check the plan is still current
        # The job starts here only after a reviewer approved, which can be days after the plan. A deployment
        # writes the whole template of this run's commit, so an approval that comes after a later merge would
        # write older code over a newer deployment, and no plan of this run would show it. The step stops the job
        # when master's tip is no longer the commit of this run, and when the plan is older than 72 hours, or the
        # whole number of hours in the repository variable MIRROR_MAX_PLAN_AGE_HOURS (1 to 720). Nothing is
        # written to Azure before it. The deployment is then started again with Run workflow.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_COMMIT: ${{ github.sha }}
          PLANNED: ${{ needs.plan.outputs.planned }}
          MAX_HOURS: ${{ vars.MIRROR_MAX_PLAN_AGE_HOURS }}
        run: |
          $max = 72
          if ($env:MAX_HOURS -match '^[0-9]{1,3}\z' -and [int]$env:MAX_HOURS -ge 1 -and [int]$env:MAX_HOURS -le 720) { $max = [int]$env:MAX_HOURS }
          if ($env:PLANNED -notmatch '^[0-9]{9,11}\z') { Write-Host "::error::the plan job gave no time for its preview, so the age of the plan is not known. Start the deployment again"; exit 1 }
          $hours = ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [long]$env:PLANNED) / 3600
          if ($hours -gt $max) { Write-Host ("::error::the plan is {0:N1} hours old, and the limit is {1} hours. Azure may have changed since, so start the deployment again" -f $hours, $max); exit 1 }
          $tip = [string](& gh api "repos/$env:REPOSITORY/git/ref/heads/master" --jq '.object.sha')
          if ($LASTEXITCODE -ne 0 -or $tip -notmatch '^[0-9a-f]{40}\z') { Write-Host "::error::the tip of master could not be read, so the plan cannot be checked. Start the deployment again"; exit 1 }
          if ($tip -cne $env:RUN_COMMIT) { Write-Host "::error::master is at $tip and this plan was taken on $env:RUN_COMMIT. A merge came after the plan, so this run would deploy older code. Start the deployment again"; exit 1 }
          Write-Host ("The plan is {0:N1} hours old (limit {1}) and master is still at {2}." -f $hours, $max, $tip)
      - name: Check the environment has a client ID
        # azure/login signs in with the client ID of this environment. With no variable on the environment, the
        # repository or the organization, the sign-in would fail later with a less clear message. The step cannot
        # tell a repository or organization value from the environment's own, so the variable is set on the
        # environments only.
        shell: pwsh
        env:
          ENVIRONMENT_NAME: mirror-${{ matrix.tier }}-${{ matrix.scope }}
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        run: |
          $guid = '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\z'
          if ([string]::IsNullOrWhiteSpace($env:CLIENT_ID)) {
            Write-Error "the environment $env:ENVIRONMENT_NAME has no AZURE_CLIENT_ID variable, so the apply cannot sign in. Set it as PIPELINE.md step 3.18 says and run the workflow again"
            exit 1
          }
          if ($env:CLIENT_ID -notmatch $guid) {
            Write-Error "the AZURE_CLIENT_ID variable of the environment $env:ENVIRONMENT_NAME is not a client ID. It must be the GUID alone, with no spaces or other text. Correct it as PIPELINE.md step 3.18 says and run the workflow again"
            exit 1
          }
          Write-Host "The environment $env:ENVIRONMENT_NAME has an AZURE_CLIENT_ID."
      - name: Pin and check the Bicep CLI
        uses: ./.github/actions/setup-bicep
      - name: Give the deployment action the checked Bicep
        if: false
        # azure/bicep-deploy compiles the unit with its own copy of Bicep. It looks in the runner's tool cache for
        # the version of its bicep-version input first, and downloads that version without a hash check only when
        # the cache has none. The step puts the binary that the step above checked into the tool cache under that
        # version and checks the hash of the copy again. So the action compiles with the same binary as the plan
        # and downloads nothing. The step after the deployment fails the job if the action downloaded anyway.
        shell: pwsh
        run: |
          $version = $env:BICEP_VERSION.TrimStart('v')
          $exe = if ($IsWindows) { 'bicep.exe' } else { 'bicep' }
          $want = if ($IsWindows) { $env:BICEP_SHA256_WINDOWS } else { $env:BICEP_SHA256_LINUX }
          $cfg = if ($env:AZURE_CONFIG_DIR) { $env:AZURE_CONFIG_DIR } else { Join-Path $HOME '.azure' }
          $source = Join-Path (Join-Path $cfg 'bin') $exe
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TOOL_CACHE)) { Write-Host "::error::the runner has no tool cache folder (RUNNER_TOOL_CACHE), so the deployment action would download its own Bicep"; exit 1 }
          # The layout of the tool cache is <tool>/<version>/<architecture>, with an empty file <architecture>.complete
          # beside the folder. The action finds the binary only when both are there.
          $versionFolder = Join-Path (Join-Path $env:RUNNER_TOOL_CACHE 'bicep') $version
          $folder = Join-Path $versionFolder 'x64'
          if (Test-Path -LiteralPath $versionFolder) { Remove-Item -LiteralPath $versionFolder -Recurse -Force }
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          $copy = Join-Path $folder $exe
          Copy-Item -LiteralPath $source -Destination $copy
          New-Item -ItemType File -Path "$folder.complete" -Force | Out-Null
          if (-not $IsWindows) { chmod 755 $copy; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          $hash = (Get-FileHash -LiteralPath $copy -Algorithm SHA256).Hash
          if ($hash -ne $want) { Write-Host "::error::$exe in the tool cache has SHA256 $hash, which is not the published hash of $env:BICEP_VERSION"; exit 1 }
          # The action downloads into a new folder bicep-<random> of the temporary folder. None may be there before
          # the deployment, so that the check after it reads only what the action did.
          Get-ChildItem -LiteralPath ([IO.Path]::GetTempPath()) -Directory -Filter 'bicep-*' -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force
          Write-Host "The deployment action finds Bicep $version in the tool cache at $copy"
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Create or update the deployment stack
        # The one step that writes to Azure. The action compiles the unit's parameters file with the pinned Bicep
        # version and creates the stack, or updates it when it exists. An input that does not belong to the scope
        # of the unit is empty, and the action reads an empty input as not given.
        # The action's own description names the management group input action-on-unmanage-managementgroup, and
        # its code at this release reads action-on-unmanage-managementgroups. Both are set, so a management group
        # is detached whichever name a release reads. GitHub warns about the input the description does not
        # name, and the warning changes nothing.
        id: stack
        uses: azure/bicep-deploy@c66bb161da87636b24a64aa8e0a427645d846c57  # v2.5.0
        with:
          type: deploymentStack
          operation: create
          name: ${{ matrix.stack }}
          scope: ${{ matrix.stackScope }}
          location: ${{ matrix.location }}
          subscription-id: ${{ matrix.subscriptionId }}
          resource-group-name: ${{ matrix.resourceGroup }}
          management-group-id: ${{ matrix.managementGroup }}
          template-file: ${{ matrix.template }}
          parameters-file: ${{ matrix.parameters }}
          bicep-version: 0.49.2
          action-on-unmanage-resources: ${{ matrix.unmanage }}
          action-on-unmanage-resourcegroups: detach
          action-on-unmanage-managementgroup: detach
          action-on-unmanage-managementgroups: detach
          deny-settings-mode: none
      - name: Check the deployment action used the checked Bicep
        # Runs after a failed deployment too. The action writes a download of Bicep into a new folder bicep-<random>
        # of the temporary folder and then into the tool cache. So the job fails when such a folder exists or when
        # the binary in the tool cache no longer has the pinned hash. The deployment has run by then, so a failure
        # here means that the stack was written with a Bicep nobody checked, and the stack is read before anything
        # else is deployed.
        if: always() && steps.stack.conclusion != 'skipped'
        shell: pwsh
        run: |
          $version = $env:BICEP_VERSION.TrimStart('v')
          $exe = if ($IsWindows) { 'bicep.exe' } else { 'bicep' }
          $want = if ($IsWindows) { $env:BICEP_SHA256_WINDOWS } else { $env:BICEP_SHA256_LINUX }
          $copy = Join-Path (Join-Path (Join-Path (Join-Path $env:RUNNER_TOOL_CACHE 'bicep') $version) 'x64') $exe
          $problems = @()
          $downloads = @(Get-ChildItem -LiteralPath ([IO.Path]::GetTempPath()) -Directory -Filter 'bicep-*' -Force -ErrorAction SilentlyContinue)
          if ($downloads.Count -gt 0) { $problems += "the action downloaded its own Bicep into $($downloads[0].FullName)" }
          if (-not (Test-Path -LiteralPath $copy -PathType Leaf)) { $problems += "the tool cache no longer holds $copy" }
          elseif ((Get-FileHash -LiteralPath $copy -Algorithm SHA256).Hash -ne $want) { $problems += "$exe in the tool cache no longer has the published hash of $env:BICEP_VERSION" }
          if ($problems.Count -gt 0) { Write-Host "::error::The deployment was not compiled with the checked Bicep. $($problems -join '. '). Read the stack and the action's log before any other deployment."; exit 1 }
          Write-Host "The deployment action downloaded no Bicep, and the tool cache still holds the checked $exe."
      - name: Summarize the stack
        # Reads the stack with the Azure CLI and writes its state and its resource counts to the job summary.
        if: always()
        shell: pwsh
        env:
          UNIT: ${{ matrix.unit }}
          OUTCOME: ${{ steps.stack.outcome }}
        run: |
          & ./.github/scripts/mirror-pipeline.ps1 -Mode StackSummary
          exit $LASTEXITCODE
