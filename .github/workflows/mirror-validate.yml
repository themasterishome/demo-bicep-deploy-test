# Every job of this workflow is skipped, so no runner starts, until IT sets the repository variable
# MIRROR_PIPELINE_ENABLED to true after the setup in PIPELINE.md section 3.
#
# Offline checks on every push to master, every pull request into master and every Run workflow: secret scan,
# workflow lint, the workflow rules with the rules of deploy/units.json, and the preflight (compile, lint,
# parameter files, file layout, duplicate declarations, deployment unit files, the delegated roles). No Azure
# login, no Azure calls.
#
# The preflight is the check that keeps privileged access out of the production units. It fails a production unit
# that declares a role assignment of a role that is not on the list of its subscription in
# deploy/delegated-roles.json, or one whose role it cannot read, and it fails a list that holds Owner, User Access
# Administrator or Role Based Access Control Administrator. It reads a role assignment declared in a loop. It also
# fails a production unit that declares a role definition, which no role of a deploy identity can write.
#
# The jobs secret-scan, actionlint, workflow-hygiene, portability and preflight are required status checks in the
# branch ruleset, together with pr-gate of mirror-pr. The workflow has no path filter, because a required check that
# a path filter skips stays pending and blocks the merge. Turn on "Require branches to be up to date before
# merging" in the branch ruleset, so a pull request's preflight covers the tree that lands.
#
# Every job but one runs on windows-2025, or on ubuntu-24.04 when the repository variable MIRROR_RUNNER is
# ubuntu-24.04. The portability job runs on the other image. It always parses every script and runs the workflow
# rules and the helper tests there. It repeats the preflight on that image only for a Run workflow, for a change to
# the scripts, to the local actions under .github/actions, to bicepconfig.json, .gitattributes, .gitignore or this workflow, for a change that adds a name that
# differs only in case from another path (a Windows checkout keeps only one of the two), and when the changed files
# cannot be read. A change to Bicep, to the deployment unit files or to the documents compiles the same on both
# systems, as the preflight's layout checks of path case, name case, names Windows refuses and path length make sure,
# so the preflight job alone covers it. No other value of the variable reaches runs-on, and the runner check, the step after
# the checkout in every job, stops the job on any other runner.
name: mirror-validate

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # A pull request's newer run replaces its older one. Each push to master and each Run workflow has a group of
  # its own (its commit), so its checks always run to the end.
  group: mirror-validate-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # SHA256 of bicep-win-x64.exe (a Windows runner) and of bicep-linux-x64 (a Linux runner) in the Bicep v0.49.2
  # GitHub release. Change the three together, and the Bicep version that scripts/deploy-unit.ps1,
  # scripts/whatif-rg-sweep.sh and scripts/whatif-sub-sweep.sh require.
  BICEP_VERSION: v0.49.2
  BICEP_SHA256_WINDOWS: ACFFF0453C9BCF442AA97103ACBCD845EF366634E6EA2A2BA5734514409CE9C3
  BICEP_SHA256_LINUX: 0AB9DE90C2493F206F8281BAE74F9EE2D5ED3605548DAB1ADF41FEF185E1F7C5
  # The secret scan uses gitleaks_8.30.1_windows_x64.zip or gitleaks_8.30.1_linux_x64.tar.gz, with the SHA256 from
  # the checksums file of the Gitleaks v8.30.1 GitHub release.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256_WINDOWS: D29144DEFF3A68AA93CED33DDDF84B7FDC26070ADD4AA0F4513094C8332AFC4E
  GITLEAKS_SHA256_LINUX: 551F6FC83EA457D62A0D98237CBAD105AF8D557003051F41F3E7CA7B3F2470EB
  # The workflow lint uses actionlint_1.7.12_windows_amd64.zip or actionlint_1.7.12_linux_amd64.tar.gz, with the
  # SHA256 from the checksums file of the actionlint v1.7.12 GitHub release.
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256_WINDOWS: 6E7241B51E6817EA6A047693D8E6FED13B31819C9A0DD6C5A726E1592D22F6E9
  ACTIONLINT_SHA256_LINUX: 8ACA8DB96F1B94770F1B0D72B6DDDCB1EBB8123CB3712530B08CC387B349A3D8
  # The workflow audit uses zizmor-x86_64-pc-windows-msvc.zip or zizmor-x86_64-unknown-linux-gnu.tar.gz, with the
  # SHA256 shown for each file on the zizmor v1.32.0 GitHub release.
  ZIZMOR_VERSION: 1.32.0
  ZIZMOR_SHA256_WINDOWS: D284A16E09D9DF4CE2C000357E7B59BD531BE093BEA5718A1CE225B449B59D49
  ZIZMOR_SHA256_LINUX: BB110CC765ECA9CD7EFB2E284A956BE5974C60027B0970F16397D86208A9957B

# Actions are pinned to the full commit SHA of the release named in the comment.
jobs:
  secret-scan:
    if: vars.MIRROR_PIPELINE_ENABLED == 'true'
    runs-on: ${{ vars.MIRROR_RUNNER == 'ubuntu-24.04' && 'ubuntu-24.04' || 'windows-2025' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Runner check
        uses: ./.github/actions/runner-check
      - name: Secret scan (Gitleaks)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'gitleaks'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $name = if ($IsWindows) { "gitleaks_$($env:GITLEAKS_VERSION)_windows_x64.zip" } else { "gitleaks_$($env:GITLEAKS_VERSION)_linux_x64.tar.gz" }
          $want = if ($IsWindows) { $env:GITLEAKS_SHA256_WINDOWS } else { $env:GITLEAKS_SHA256_LINUX }
          $archive = Join-Path $dir $name
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/gitleaks/gitleaks/releases/download/v$($env:GITLEAKS_VERSION)/$name" -OutFile $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($hash -ne $want) { Write-Error "$name SHA256 $hash does not match the published hash"; exit 1 }
          if ($IsWindows) { Expand-Archive -LiteralPath $archive -DestinationPath $dir -Force }
          else { tar -xzf $archive -C $dir; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          & (Join-Path $dir $(if ($IsWindows) { 'gitleaks.exe' } else { 'gitleaks' })) detect --redact --no-banner --no-git --source . --config .gitleaks.toml
          exit $LASTEXITCODE

  actionlint:
    if: vars.MIRROR_PIPELINE_ENABLED == 'true'
    runs-on: ${{ vars.MIRROR_RUNNER == 'ubuntu-24.04' && 'ubuntu-24.04' || 'windows-2025' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Runner check
        uses: ./.github/actions/runner-check
      - name: Workflow lint (actionlint)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'actionlint'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $name = if ($IsWindows) { "actionlint_$($env:ACTIONLINT_VERSION)_windows_amd64.zip" } else { "actionlint_$($env:ACTIONLINT_VERSION)_linux_amd64.tar.gz" }
          $want = if ($IsWindows) { $env:ACTIONLINT_SHA256_WINDOWS } else { $env:ACTIONLINT_SHA256_LINUX }
          $archive = Join-Path $dir $name
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/rhysd/actionlint/releases/download/v$($env:ACTIONLINT_VERSION)/$name" -OutFile $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($hash -ne $want) { Write-Error "$name SHA256 $hash does not match the published hash"; exit 1 }
          if ($IsWindows) { Expand-Archive -LiteralPath $archive -DestinationPath $dir -Force }
          else { tar -xzf $archive -C $dir; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          # actionlint 1.7.12 does not know the queue key of a concurrency group yet (GitHub added it later).
          # That one message is ignored until a newer release knows it. The pattern is a regular expression and
          # uses . for the double quotes of the message, so it reaches the program unchanged on every system.
          # The shellcheck and pyflakes checks are off. They read bash and Python steps, and every step here runs pwsh.
          & (Join-Path $dir $(if ($IsWindows) { 'actionlint.exe' } else { 'actionlint' })) -shellcheck= -pyflakes= -ignore 'unexpected key .queue. for .concurrency. section'
          exit $LASTEXITCODE

  workflow-hygiene:
    # A deploy token goes to any job that names a production environment from master, so only the deploy workflow
    # may name one and no workflow uses a trigger that runs pull request code with master's rights. Every action
    # must be one of the allowed ones and pinned to a full commit SHA, which zizmor checks (rules in
    # .github/zizmor.yml) before the helper's rules run. The helper's step also reads deploy/units.json. Every unit
    # must give a stack row, the unit of a deploy-excluded file may be neither enabled nor marked deployed, and stackDeletes
    # stays off for the tenant units and the units of fdm-apim. The rules are in .github/scripts/mirror-pipeline.ps1. They
    # are text matches that catch mistakes, and on a pull request they run the pull request's own copy. The
    # controls are the production environments' branch policy (master only), the code owners' review and the push
    # ruleset on .github/**.
    if: vars.MIRROR_PIPELINE_ENABLED == 'true'
    runs-on: ${{ vars.MIRROR_RUNNER == 'ubuntu-24.04' && 'ubuntu-24.04' || 'windows-2025' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Runner check
        uses: ./.github/actions/runner-check
      - name: Workflow audit (zizmor)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'zizmor'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $name = if ($IsWindows) { 'zizmor-x86_64-pc-windows-msvc.zip' } else { 'zizmor-x86_64-unknown-linux-gnu.tar.gz' }
          $want = if ($IsWindows) { $env:ZIZMOR_SHA256_WINDOWS } else { $env:ZIZMOR_SHA256_LINUX }
          $archive = Join-Path $dir $name
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/zizmorcore/zizmor/releases/download/v$($env:ZIZMOR_VERSION)/$name" -OutFile $archive
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($hash -ne $want) { Write-Error "$name SHA256 $hash does not match the published hash"; exit 1 }
          if ($IsWindows) { Expand-Archive -LiteralPath $archive -DestinationPath $dir -Force }
          else { tar -xzf $archive -C $dir; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          # Offline, so no audit calls the GitHub API. The settings are in .github/zizmor.yml.
          & (Join-Path $dir $(if ($IsWindows) { 'zizmor.exe' } else { 'zizmor' })) --offline .github/workflows
          exit $LASTEXITCODE
      - name: Workflow rules and unit rules
        shell: pwsh
        run: |
          & ./.github/scripts/mirror-pipeline.ps1 -Mode Hygiene
          exit $LASTEXITCODE
      - name: Helper tests (offline)
        shell: pwsh
        run: |
          & ./.github/scripts/tests/mirror-pipeline.tests.ps1
          exit $LASTEXITCODE

  portability:
    # The checks on the other runner image, ubuntu-24.04 while the other jobs use windows-2025 and windows-2025
    # when they use ubuntu-24.04. It always parses every script (bash -n for the .sh files), applies the workflow
    # rules and runs the helper tests, with a stand-in for the Azure CLI that answers from files. The
    # step "Decide the scope" then reads the change. For a Run workflow, a change to the scripts, to bicepconfig.json,
    # .gitattributes, .gitignore or this workflow, a change that adds a name that differs only in case from another
    # path, and when the changed files cannot be read, the job also runs what the preflight job runs:
    # the pinned Bicep CLI and scripts/preflight-validate.ps1. Any other change compiles the same on both systems,
    # so the preflight job covers it. A required status
    # check. It has no needs, and its only job condition is the pipeline switch, so it never stays pending. No Azure
    # login, no Azure calls.
    if: vars.MIRROR_PIPELINE_ENABLED == 'true'
    runs-on: ${{ vars.MIRROR_RUNNER == 'ubuntu-24.04' && 'windows-2025' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Runner check
        uses: ./.github/actions/runner-check
      - name: Decide the scope
        id: scope
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          & ./.github/scripts/mirror-pipeline.ps1 -Mode PortabilityScope
          exit $LASTEXITCODE
      - name: Parse every script
        shell: pwsh
        run: |
          $failed = 0
          $ps = @(Get-ChildItem -LiteralPath 'scripts', '.github/scripts' -Recurse -File -Filter '*.ps1')
          foreach ($f in $ps) {
            $tokens = $null; $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errs)
            $rel = [IO.Path]::GetRelativePath((Get-Location).Path, $f.FullName)
            foreach ($e in @($errs)) { $failed++; Write-Host "::error file=$rel,line=$($e.Extent.StartLineNumber)::$($e.Message -replace '[\r\n]+', ' ')" }
          }
          # On Windows the first bash on PATH can be the one of the Windows Subsystem for Linux, so the step names
          # the bash of Git for Windows.
          $bash = if ($IsWindows) { Join-Path $env:ProgramFiles 'Git/bin/bash.exe' } else { 'bash' }
          $sh = @(Get-ChildItem -LiteralPath 'scripts' -Recurse -File -Filter '*.sh')
          foreach ($f in $sh) {
            & $bash -n $f.FullName
            if ($LASTEXITCODE -ne 0) { $failed++; Write-Host "::error file=$([IO.Path]::GetRelativePath((Get-Location).Path, $f.FullName))::bash -n failed" }
          }
          Write-Host "$($ps.Count) PowerShell and $($sh.Count) shell script(s) parsed, $failed error(s), PowerShell $($PSVersionTable.PSVersion) on $($PSVersionTable.OS)"
          if ($failed -gt 0) { exit 1 }
          exit 0
      - name: Workflow rules and unit rules
        shell: pwsh
        run: |
          & ./.github/scripts/mirror-pipeline.ps1 -Mode Hygiene
          exit $LASTEXITCODE
      - name: Helper tests (offline)
        shell: pwsh
        run: |
          & ./.github/scripts/tests/mirror-pipeline.tests.ps1
          exit $LASTEXITCODE
      - name: Pin and check the Bicep CLI
        id: bicep
        if: ${{ steps.scope.outputs.full == 'true' }}
        uses: ./.github/actions/setup-bicep
      - name: Preflight
        id: preflight
        if: ${{ steps.scope.outputs.full == 'true' }}
        shell: pwsh
        run: ./scripts/preflight-validate.ps1 -OutDir (Join-Path $env:RUNNER_TEMP 'build-logs')
      - name: Job summary
        if: always()
        shell: pwsh
        env:
          FULL: ${{ steps.scope.outputs.full }}
          OUTCOME: ${{ steps.preflight.outcome }}
        run: |
          $text = if ($env:FULL -ceq 'true') { "Full scope. Preflight on ${env:RUNNER_OS}: $env:OUTCOME. The full logs are in the build-logs-portability artifact." }
          else { "Light scope. The scripts were parsed and the workflow rules and helper tests ran on $env:RUNNER_OS. The preflight was left to the preflight job, because the change touches no script, no bicepconfig.json, no .gitattributes or .gitignore and no validate workflow." }
          $text | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: build-logs-portability
          path: ${{ runner.temp }}/build-logs

  preflight:
    if: vars.MIRROR_PIPELINE_ENABLED == 'true'
    runs-on: ${{ vars.MIRROR_RUNNER == 'ubuntu-24.04' && 'ubuntu-24.04' || 'windows-2025' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Runner check
        uses: ./.github/actions/runner-check
      - name: Pin and check the Bicep CLI
        id: bicep
        uses: ./.github/actions/setup-bicep
      - name: Tool versions
        shell: pwsh
        run: |
          az version -o json
          az bicep version
      - name: Preflight
        id: preflight
        shell: pwsh
        run: ./scripts/preflight-validate.ps1 -OutDir (Join-Path $env:RUNNER_TEMP 'build-logs')
      - name: Job summary
        if: always()
        shell: pwsh
        env:
          OUTCOME: ${{ steps.preflight.outcome }}
        run: |
          "Preflight: $env:OUTCOME. The full logs are in the build-logs artifact." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: build-logs
          path: ${{ runner.temp }}/build-logs
