# Every job of this workflow is skipped, so no runner starts, until IT sets the repository variable
# MIRROR_PIPELINE_ENABLED to true after the setup in PIPELINE.md section 3.
#
# The preview on every pull request into master. It is read-only. The one job that signs in to Azure uses the reader
# identity of the mirror-reader environment.
#
# Every pull request gets, for information, a deployment stack preview of each unit whose files it changes (the job
# matrix holds at most 256 jobs). The preview is what a deployment of the unit would do after the merge: the resources it would create, change,
# detach or delete. A unit whose stack does not exist yet is previewed the same way, and its resources then show as
# coming under the stack's management. Nothing deploys from a pull request, and the merge deploys nothing either. A
# deployment is started with Run workflow (mirror-deploy-unit), and its apply waits for the reviewers of the unit's
# environment.
#
# The pr-gate job is the required status check. It fails when the units could not be listed or a preview could
# not be taken, for example because a template is not valid. A preview that shows changes passes, because a pull
# request is there to change something. A pull request can edit this workflow and so make its own check pass. That
# is why mirror-deploy-unit plans again on master before anything is deployed. The push ruleset on .github/** (only
# IT's approvers may push a change there, on any branch) stops a writer from running a changed copy of this
# workflow at all, for example from a pull request into another branch that is later retargeted to master. The
# edited trigger takes a new preview when the base branch changes.
#
# Each preview is in the job summary of its whatif job, on the run page that the pull request's checks link to,
# and nobody can edit it there. The artifact of the job holds the same preview as JSON and as text.
#
# Anyone with write access can open a pull request, and a pull request runs its own copy of this workflow, so
# anyone with write access can use the reader identity. Give write access only to people who already hold the
# Reader and Mirror What-If Reader roles on the 10 subscriptions and the Tenant Root Group. Anyone with read access can download the
# previews, which hold the live settings of the estate. The whatif job runs the helper script and the local actions
# of master's tip, not the pull request's, and only the Bicep files and deploy/units.json come from the pull
# request. Before the sign-in it refuses Bicep that reads environment variables, registry modules or files outside
# the repository.
#
# The preview runs the Azure CLI (az stack validate, az stack-whatif) and not the action azure/bicep-deploy. This
# is not yet done because the released action (v2.5.0) sends no validation level with a stack preview, so Azure
# refuses the reader identity, and because the action writes a preview to the log only.
name: mirror-pr

on:
  pull_request:
    branches: [ master ]
    # edited covers a change of the base branch, so a pull request retargeted to master is previewed again.
    types: [ opened, synchronize, reopened, edited ]

permissions:
  contents: read

concurrency:
  group: mirror-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # SHA256 of bicep-win-x64.exe (a Windows runner) and of bicep-linux-x64 (a Linux runner) in the Bicep v0.49.2
  # GitHub release. Change the three together, with the bicep-version input in mirror-deploy-unit.yml and the Bicep
  # version that scripts/deploy-unit.ps1, scripts/whatif-rg-sweep.sh and scripts/whatif-sub-sweep.sh require.
  BICEP_VERSION: v0.49.2
  BICEP_SHA256_WINDOWS: ACFFF0453C9BCF442AA97103ACBCD845EF366634E6EA2A2BA5734514409CE9C3
  BICEP_SHA256_LINUX: 0AB9DE90C2493F206F8281BAE74F9EE2D5ED3605548DAB1ADF41FEF185E1F7C5

# Actions are pinned to the full commit SHA of the release named in the comment. Every job runs on windows-2025, or
# on ubuntu-24.04 when the repository variable MIRROR_RUNNER is ubuntu-24.04. No other value of the variable reaches
# runs-on, and the runner check, the step after the checkout in every job, stops the job on any other runner. The
# runner check and the Bicep pin are the two local actions under .github/actions.
jobs:
  units:
    # No Azure. Lists the units to preview.
    if: vars.MIRROR_PIPELINE_ENABLED == 'true'
    runs-on: ${{ vars.MIRROR_RUNNER == 'ubuntu-24.04' && 'ubuntu-24.04' || 'windows-2025' }}
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.units.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The run's commit is GitHub's test merge of the branch into master's tip. Its first parent, master's
          # tip, is needed to tell what the merge would change.
          fetch-depth: 2
          persist-credentials: false
      - name: Runner check
        uses: ./.github/actions/runner-check
      - id: units
        name: List the units the pull request changes
        shell: pwsh
        env:
          SELECT: pullRequest
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          & ./.github/scripts/mirror-pipeline.ps1 -Mode Units
          exit $LASTEXITCODE

  whatif:
    # The reader identity, read-only. One job per unit, four at a time.
    needs: units
    if: vars.MIRROR_PIPELINE_ENABLED == 'true' && needs.units.outputs.matrix != '[]'
    name: whatif ${{ matrix.unit }}
    runs-on: ${{ vars.MIRROR_RUNNER == 'ubuntu-24.04' && 'ubuntu-24.04' || 'windows-2025' }}
    environment:
      name: mirror-reader
      deployment: false
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.units.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Runner check
        uses: ./.github/actions/runner-check
      # Master's tip, the first parent of this run's test merge commit. The code that runs with the reader token
      # comes from there, never from the branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          path: trusted
          persist-credentials: false
          # Only what the job takes from it.
          sparse-checkout: |
            /.github/scripts/
            /.github/actions/
            /bicepconfig.json
          sparse-checkout-cone-mode: false
      - name: Take the scripts from master
        # The preview keeps the pull request's Bicep files and deploy/units.json and takes .github/scripts/,
        # .github/actions/ and bicepconfig.json from master's tip.
        shell: pwsh
        env:
          MERGE_SHA: ${{ github.sha }}
        run: |
          $ws = $env:GITHUB_WORKSPACE
          $t = Join-Path $ws 'trusted'
          git -C $t checkout --quiet --detach HEAD^1
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::the first parent of the test merge commit is not in the checkout"; exit 2 }
          $trusted = ((git -C $t rev-parse HEAD) -join '').Trim()
          $code = ((git -C $ws rev-parse HEAD) -join '').Trim()
          if ($code -cne $env:MERGE_SHA) { Write-Host "::error::the preview is of the test merge commit $env:MERGE_SHA, and the checkout holds $code"; exit 2 }
          foreach ($s in @('.github/scripts', '.github/actions', 'bicepconfig.json')) {
            if (-not (Test-Path -LiteralPath (Join-Path $t $s))) { Write-Host "::error::$s is missing from master's checkout"; exit 2 }
          }
          foreach ($d in @('.github/scripts', '.github/actions')) {
            $p = Join-Path $ws $d
            if (Test-Path -LiteralPath $p) { Remove-Item -LiteralPath $p -Recurse -Force }
            Copy-Item -LiteralPath (Join-Path $t $d) -Destination $p -Recurse
          }
          Copy-Item -LiteralPath (Join-Path $t 'bicepconfig.json') -Destination (Join-Path $ws 'bicepconfig.json') -Force
          Remove-Item -LiteralPath $t -Recurse -Force
          "MIRROR_TRUSTED_COMMIT=$trusted" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MIRROR_CODE_COMMIT=$code" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Scripts from master's tip $trusted. Bicep files from $code."
      - name: Check the Bicep inputs
        # Before the sign-in. Bicep from the pull request may not read environment variables, registry modules or
        # files outside the repository, because the job holds the reader token.
        shell: pwsh
        env:
          UNIT: ${{ matrix.unit }}
        run: |
          & ./.github/scripts/mirror-pipeline.ps1 -Mode InputCheck
          exit $LASTEXITCODE
      - name: Pin and check the Bicep CLI
        uses: ./.github/actions/setup-bicep
      - name: Tool versions
        shell: pwsh
        run: |
          az version -o json
          az bicep version
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Validate and preview the stack
        # az stack validate, then az stack-whatif. It leaves one preview object at the scope of the stack. Azure
        # deletes it after its retention of one hour, which can take some hours longer.
        shell: pwsh
        env:
          UNIT: ${{ matrix.unit }}
        run: |
          & ./.github/scripts/mirror-pipeline.ps1 -Mode StackWhatIf -Dir (Join-Path $env:RUNNER_TEMP 'preview')
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: preview-${{ matrix.unit }}
          path: ${{ runner.temp }}/preview
          overwrite: true
          # A preview is for information and is kept 14 days.
          retention-days: 14

  pr-gate:
    # The required status check. No Azure. It passes when the units were listed and every preview was taken, or
    # when the pull request changes no unit.
    needs: [ units, whatif ]
    if: vars.MIRROR_PIPELINE_ENABLED == 'true' && always()
    runs-on: ${{ vars.MIRROR_RUNNER == 'ubuntu-24.04' && 'ubuntu-24.04' || 'windows-2025' }}
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Runner check
        uses: ./.github/actions/runner-check
      - name: Decide
        shell: pwsh
        env:
          UNITS_RESULT: ${{ needs.units.result }}
          WHATIF_RESULT: ${{ needs.whatif.result }}
          MATRIX: ${{ needs.units.outputs.matrix }}
        run: |
          $text = if ($env:UNITS_RESULT -cne 'success') { "The units of this pull request could not be listed (result $env:UNITS_RESULT). The units job says why." }
                  elseif ($env:MATRIX -ceq '[]') { 'This pull request changes no unit, so there is nothing to preview.' }
                  elseif ($env:WHATIF_RESULT -cne 'success') { "At least one preview could not be taken (result $env:WHATIF_RESULT). The summary of its whatif job says why." }
                  else { 'Every unit this pull request changes was previewed. The summary of each whatif job holds its preview.' }
          $text | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          Write-Host $text
          if ($env:UNITS_RESULT -cne 'success' -or ($env:MATRIX -cne '[]' -and $env:WHATIF_RESULT -cne 'success')) { exit 1 }
