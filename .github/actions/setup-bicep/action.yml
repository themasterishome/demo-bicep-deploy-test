name: Set up Bicep
description: Installs the pinned Bicep CLI through the Azure CLI, checks its SHA256 and checks that the Azure CLI uses it. The version and the two hashes come from BICEP_VERSION, BICEP_SHA256_WINDOWS and BICEP_SHA256_LINUX in the calling workflow.
runs:
  using: composite
  steps:
    - name: Pin the Bicep CLI
      shell: pwsh
      run: |
        # The Azure CLI installs bicep-win-x64.exe as bicep.exe on a Windows runner and bicep-linux-x64 as bicep
        # on a Linux runner. Both hashes are pinned in the env block of the calling workflow, for x64 runners only.
        if ($env:RUNNER_ARCH -ne 'X64' -or @('Windows', 'Linux') -notcontains $env:RUNNER_OS) { Write-Error "the runner is $env:RUNNER_OS $env:RUNNER_ARCH, and the Bicep CLI is pinned for Windows or Linux on x64"; exit 1 }
        $exe = if ($IsWindows) { 'bicep.exe' } else { 'bicep' }
        $want = if ($IsWindows) { $env:BICEP_SHA256_WINDOWS } else { $env:BICEP_SHA256_LINUX }
        # In a GitHub job the Azure CLI would use the first bicep on PATH, which is the runner image's own copy.
        # With bicep.use_binary_from_path set to false it always uses the copy it installs in the bin folder of its
        # configuration folder, which is the copy whose hash is checked below. The setting is kept in the Azure CLI's
        # configuration file, so it holds for the later steps of the job. The step writes nothing to GITHUB_PATH or
        # GITHUB_ENV, because a later step that trusted such a file would run whatever it named.
        az config set bicep.use_binary_from_path=false --only-show-errors
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        az bicep install --version $env:BICEP_VERSION
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $cfg = if ($env:AZURE_CONFIG_DIR) { $env:AZURE_CONFIG_DIR } else { Join-Path $HOME '.azure' }
        $file = Join-Path (Join-Path $cfg 'bin') $exe
        $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
        if ($hash -ne $want) { Write-Error "$exe SHA256 $hash does not match the published hash of $env:BICEP_VERSION"; exit 1 }
        # On Linux the file must be executable. The Azure CLI sets that, and the step sets it again.
        if (-not $IsWindows) { chmod 755 $file; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
        $setting = ((az config get bicep.use_binary_from_path --query value -o tsv --only-show-errors) -join '').Trim()
        if ($LASTEXITCODE -ne 0 -or $setting -ne 'false') { Write-Error "the Azure CLI setting bicep.use_binary_from_path reads '$setting', expected false"; exit 1 }
        $v = (az bicep version) -join ' '
        $version = $env:BICEP_VERSION.TrimStart('v')
        if ($LASTEXITCODE -ne 0 -or $v -notmatch ('version ' + [regex]::Escape($version) + '\b')) { Write-Error "az bicep version reports '$v', expected $version"; exit 1 }
        Write-Host "The Azure CLI uses Bicep $version from $file"
